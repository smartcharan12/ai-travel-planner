# EXAMPLE ONLY: placeholders, NOT applied by kustomize, and real values must NEVER be committed.
# Local cluster: create the real Secret from your .env instead of editing this file:
#   kubectl -n travel-planner create secret generic api-secrets \
#     --from-literal=GEMINI_API_KEY=... --from-literal=TAVILY_API_KEY=...
# GKE: secrets come from Google Secret Manager (overlays/gke/secret-provider-class.yaml), not from this.
apiVersion: v1
kind: Secret
metadata:
  name: api-secrets
  namespace: travel-planner
type: Opaque
stringData:
  GEMINI_API_KEY: "REPLACE_ME"
  TAVILY_API_KEY: "REPLACE_ME"
