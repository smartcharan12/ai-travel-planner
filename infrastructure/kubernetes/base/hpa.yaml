# Scale the API between 2 and 6 replicas on average CPU utilisation (relative to the CPU *request*).
# Requires the metrics API (metrics-server; built into GKE). Caveat: plans mostly WAIT on Gemini,
# so CPU rises less than load does. Tuning notes in docs/23_kubernetes.md.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: api}
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 60}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300    # avoid flapping: wait 5 min of low load before removing pods
