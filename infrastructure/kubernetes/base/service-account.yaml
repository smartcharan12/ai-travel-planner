# One identity per workload. Neither pod talks to the Kubernetes API, so tokens are not mounted
# (automountServiceAccountToken: false). On GKE, Workload Identity grants the API's identity
# access to its Secret Manager secrets, and nothing else.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend
automountServiceAccountToken: false
