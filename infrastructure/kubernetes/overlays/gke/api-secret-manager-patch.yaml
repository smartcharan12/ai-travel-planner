# Mount the API keys from Google Secret Manager as files (GKE Secret Manager add-on, CSI driver).
# The app reads them via SECRETS_DIR (pydantic-settings secrets_dir). Access is granted to the
# Kubernetes ServiceAccount `api` through Workload Identity; no JSON key file exists anywhere.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  template:
    spec:
      containers:
        - name: api
          env:
            - {name: SECRETS_DIR, value: /var/secrets}
          volumeMounts:
            - {name: secrets, mountPath: /var/secrets, readOnly: true}
      volumes:
        - name: secrets
          csi:
            driver: secrets-store-gke.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: api-secrets
