# Which Secret Manager secrets to mount, and as which file names (= the env var names the app expects).
# Requires the GKE Secret Manager add-on (--enable-secret-manager) and the IAM binding in docs/24_gcp.md.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: api-secrets
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/PROJECT_ID/secrets/gemini-api-key/versions/latest"
        path: "GEMINI_API_KEY"
      - resourceName: "projects/PROJECT_ID/secrets/tavily-api-key/versions/latest"
        path: "TAVILY_API_KEY"
