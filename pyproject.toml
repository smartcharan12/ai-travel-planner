[project]
name = "ai-travel-planner"
version = "0.1.0"
description = "AI travel itinerary planner: FastAPI + LangGraph + real-time search, with LLMOps tooling."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# Dependencies are pinned in requirements.txt / requirements-dev.txt so that
# Docker, CI and local installs all resolve to identical versions.

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
# E/F = pycodestyle + pyflakes, I = import sorting, B = common bugs,
# UP = modern syntax, SIM = simplifications.
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]  # FastAPI's Depends() in default arguments is idiomatic.

[tool.pytest.ini_options]
testpaths = ["tests"]
# DeepEval registers a pytest plugin; keep it out of the fast offline suite (evaluation/ has its own pytest.ini).
addopts = "-ra -p no:deepeval"
markers = [
    "integration: several of our components together; external services faked (runs offline)",
    "live: calls real Tavily/Gemini APIs; skipped unless RUN_LIVE_TESTS=1 and keys are set",
]
