# LIVE evaluation against real Tavily + Gemini. Manual only: every run costs API credits,
# and results vary with today's web, so it must not run on every commit.
# Required repository SECRETS: GEMINI_API_KEY, TAVILY_API_KEY.
name: Live LLM evaluation

on:
  workflow_dispatch:
    inputs:
      judge:
        description: "Also run LLM-as-judge metrics (more cost)"
        type: boolean
        default: false
      cases:
        description: "Comma-separated case ids (empty = all 10)"
        type: string
        default: ""
  # To run weekly, uncomment (and budget for it):
  # schedule:
  #   - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: evaluation
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      DEEPEVAL_TELEMETRY_OPT_OUT: "YES"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-eval.txt
      - name: Live smoke tests
        run: RUN_LIVE_TESTS=1 pytest tests/live -v
      - name: Live evaluation
        env:
          JUDGE: ${{ inputs.judge && '--judge' || '' }}
          CASES: ${{ inputs.cases }}
        run: |
          args="--mode live --report-only $JUDGE"
          if [ -n "$CASES" ]; then args="$args --cases $CASES"; fi
          python -m evaluation.runner $args
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: live-evaluation-report
          path: evaluation/results/*.json
