# Logstash pipeline: application JSON log file -> Elasticsearch.
# Explained section by section in docs/20_elk_stack.md.

input {
  # The API writes one JSON object per line to /var/log/app/app.jsonl (LOG_FILE).
  # docker-compose mounts the same named volume here, read-only.
  file {
    path => "/var/log/app/app.jsonl"
    start_position => "beginning"                         # first run: read existing lines too
    sincedb_path => "/usr/share/logstash/data/sincedb"     # remembers the read position across restarts
    codec => json                                          # each line is parsed as a JSON object
    mode => "tail"
  }
}

filter {
  # A line that was not valid JSON is kept (with Logstash's tag) instead of being lost.
  if "_jsonparsefailure" in [tags] {
    mutate { add_field => { "event_type" => "unparsed" } }
  }

  # Use the application's own timestamp as the event time, not the time Logstash read the line.
  date {
    match => ["timestamp", "ISO8601"]
    target => "@timestamp"
    remove_field => ["timestamp"]
  }

  mutate {
    # Normalise types so Elasticsearch never guesses them differently on different days.
    convert => {
      "status" => "integer"
      "latency_ms" => "float"
      "llm_call_count" => "integer"
      "search_call_count" => "integer"
      "input_tokens" => "integer"
      "output_tokens" => "integer"
      "total_tokens" => "integer"
    }
    # File-input bookkeeping that is not useful in Kibana.
    remove_field => ["host", "path", "@version"]
    # Defence in depth: the app never logs these, but if a future change did, drop them here.
    # (Logstash removes a listed field only if it exists.)
  }
  mutate { remove_field => ["api_key", "authorization", "password", "secret", "prompt", "messages"] }

  mutate { add_field => { "pipeline" => "travel-planner-logs" } }
}

output {
  elasticsearch {
    hosts => ["${ELASTICSEARCH_URL:http://elasticsearch:9200}"]
    index => "travel-planner-logs-%{+YYYY.MM.dd}"   # one index per day: easy to delete old days
    data_stream => false
    # Install our mapping before the first document arrives, so field types are explicit.
    manage_template => true
    template => "/usr/share/logstash/templates/travel-planner-logs.json"
    template_name => "travel-planner-logs"
    template_overwrite => true
  }
}
